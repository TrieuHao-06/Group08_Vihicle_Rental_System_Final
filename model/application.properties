server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/thuexe?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Gửi mail cấp lại mật khẩu (ví dụ Gmail: dùng App Password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.servlet.session.timeout=30m

# Tỷ lệ hoa hồng nền tảng trên tiền thuê xe (không tính tiền cọc) -> "Doanh thu ròng chủ xe"
app.wallet.commission-rate=0.10
